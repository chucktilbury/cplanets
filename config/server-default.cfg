# CPlanets unified server config (process/network + §14 scenario).
# Own file — parallel to config/ai-*.cfg and config/human-default.cfg.
# key = value. Unknown keys fail loud. Legacy `setup = PATH` is
# rejected — fold former scenarios/*.setup keys into this file.
# Every CLI flag except --config PATH may be set here; argv present
# on the command line overrides silently. See doc/SERVER-CONFIG.md.

# --- listen bind ---
# Default loopback matches prior hard-coded TCP listen.
# Use 0.0.0.0 (or empty, after clamp → 127.0.0.1) for all
# interfaces: prefer an explicit 0.0.0.0 when serving LAN.
# `address` is accepted as an alias for `host`.
# Sample play port is 7700 (match human/AI samples). Pass
# `--port 0` (or `port = 0`) for an ephemeral OS-assigned port
# in CI / harnesses that read the PORT= banner.
host = 127.0.0.1
port = 7700

# --- start galaxy process knobs ---
# Soft max allocated seats (0 = unlimited). Seats grow on connect;
# this is not a hard fixed seat array. When > 0, also an expected
# ceiling hint in the status banner (go does not wait for it).
players = 0
seed = 7
# Absolute seat bound when players soft max is 0 / unlimited.
seat_hard_cap = 256

# --- serve loop ---
serve = true
cycles = 0
injectable = false
# While serving, type m then Enter on the server console for the
# read-only status menu (ticks pause while open; q resumes).

# Stdout log level 0–10 (clamped). Provisional: 0 errors only,
# 3+ settings PUTs, 6+ combat, 10 full dumps. CLI --verbosity
# overlays this when provided.
verbosity = 10
# ServerVerboseLog capture ring size.
verbose_capture_lines = 64

# --- presence / accept poll / recv (former hard-coded literals) ---
# Drop a seat after this many ms without PUT /handshake.
handshake_miss_ms = 5000
# Accept/recv timeout used as cadence poll granularity (ms).
accept_poll_ms = 50
# Max bytes per accepted client request frame.
recv_buffer_bytes = 65536

# --- optional AI client spawn (CPL-106) ---
# After listen, spawn N stand-alone cplanets-ai processes via the
# Cwhip process package. Each child gets its own config file
# (copied from spawn_ai_template) with a unique display_name and
# dial host/port matching the live bind. 0 = do not spawn.
spawn_ai_count = 0
# Required when spawn_ai_count > 0 (path to an AI config template).
spawn_ai_template = config/ai-default.cfg
# Directory for generated per-AI configs. Empty → system temp dir.
spawn_ai_dir =
# Path to cplanets-ai. Empty → sibling of cplanets-server argv[0].
spawn_ai_bin =

# === §14 scenario / galaxy knobs (former scenarios/*.setup) ===
# Magnitudes are placeholders. Knob edits take effect on restart.

