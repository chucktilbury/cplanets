# Human client settings (not the AI config file).
# Clients never tick and never open the universe DB.
#
# TCP seats are server-assigned on PUT /handshake — do not set
# player_id for live play (legacy key ignored for seating). Offline
# --once / port 0 may still use player_id / --player as a local seat.

host = 127.0.0.1
# Sample play port matches config/server-default.cfg (7700).
# Set port = 0 for offline --gui / --test (in-process galaxy).
port = 7700

# Seat display name shown in chrome / digest (PUT /name after
# handshake). Changeable here; empty falls back to "Human".
display_name = Human

# --- process / CLI defaults (argv overrides silently; not --config) ---
once = false
pull = false
gui = true
test = false

# Live GUI GET /state + GET /digest poll period (ms). 0 = off
# (File→Refresh only). Default 1000 ≈ near-tick feel for
# develop/build ProgressBars and lists. Distinct from presence
# keep-alive handshake (~2s). CLI --refresh-ms.
refresh_ms = 1000
