# CPlanets AI client default config (PLAN §4.H / RULES §2).
# Own file — not the human settings file. key = value.
# Axes are soft (0.0) → hard (1.0). Magnitudes are placeholders.
#
# TUNING SURFACE (workstream A) — edit here, restart cplanets-ai.
# Unknown keys fail loud. Not the scenario setup file.

# --- AI difficulty axes ---
aggression = 0.55
role_stickiness = 0.70
expansion = 0.50
escort = 0.55
agreement_appetite = 0.40
tech_vs_hulls = 0.45

# --- reaction lag (ticks + wall; binding shape still open) ---
reaction_lag_ticks = 1
reaction_lag_seconds = 5.0
surprise_rate = 0.05

# --- dial / seat ---
# Sample play port matches config/server-default.cfg (7700).
seed = 42
player_id = 0
host = 127.0.0.1
port = 7700

# Stdout decision logging 0–10 (clamped). Provisional: 0 errors
# only, 3+ seat / policy / cycle, 10 full dumps. CLI --verbosity
# overlays this when provided.
verbosity = 0

# --- process / CLI defaults (argv overrides silently; not --config) ---
# cycles: 0 = --serve-loop until eliminated / game ended / stop;
#         N > 0 caps attempts (smoke / harness). --once stays one-shot.
cycles = 0
once = false
serve_loop = false
